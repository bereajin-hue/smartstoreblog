<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네이버 블로그 자동 포스터</title>
  <style>
    /* ── CSS 변수 ──────────────────────────────────────────────────────────── */
    :root {
      --primary:        #03C75A;
      --primary-hover:  #02a84a;
      --primary-dim:    #e6f9ee;
      --danger:         #e03131;
      --warning:        #e67700;

      --sidebar-bg:     #f7f8f9;
      --sidebar-width:  220px;
      --topbar-height:  56px;

      --bg:             #f0f2f5;
      --surface:        #ffffff;
      --surface-hover:  #f4f6f8;
      --border:         rgba(0, 0, 0, 0.08);
      --border-solid:   #e2e5e9;

      --text-primary:   #191f28;
      --text-secondary: #6b7685;
      --text-disabled:  #adb5bd;

      --shadow-sm:      0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:      0 4px 12px rgba(0,0,0,.08);

      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      14px;

      --nav-active-bg:  #e6f9ee;
      --nav-active-txt: #018a3c;

      --log-bg:         #f4f4f4;
      --log-text:       #1a1a1a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary-dim:    #0d3320;

        --sidebar-bg:     #1a1a1a;

        --bg:             #0f0f0f;
        --surface:        #1e1e1e;
        --surface-hover:  #252525;
        --border:         rgba(255,255,255,.08);
        --border-solid:   #2e2e2e;

        --text-primary:   #e8eaed;
        --text-secondary: #9aa0a6;
        --text-disabled:  #5f6368;

        --shadow-sm:      0 1px 3px rgba(0,0,0,.4);
        --shadow-md:      0 4px 12px rgba(0,0,0,.5);

        --nav-active-bg:  #0d3320;
        --nav-active-txt: #4ee68a;

        --log-bg:         #111111;
        --log-text:       #c8d6c8;
      }
    }

    /* ── 리셋 ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* ── 전체 레이아웃 ─────────────────────────────────────────────────────── */
    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 사이드바 ──────────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-solid);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-brand {
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-solid);
      flex-shrink: 0;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-name span {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    /* ── 네비게이션 ────────────────────────────────────────────────────────── */
    .nav-section {
      padding: 12px 10px 0;
      flex: 1;
      overflow-y: auto;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--text-disabled);
      text-transform: uppercase;
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 13.5px;
      transition: background .15s, color .15s;
      user-select: none;
      margin-bottom: 2px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--nav-active-bg);
      color: var(--nav-active-txt);
      font-weight: 600;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: .7;
    }

    .nav-item.active .nav-icon {
      opacity: 1;
    }

    .nav-badge {
      margin-left: auto;
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid var(--border-solid);
      flex-shrink: 0;
    }

    .sidebar-version {
      font-size: 11px;
      color: var(--text-disabled);
      text-align: center;
    }

    /* ── 오른쪽 메인 영역 ──────────────────────────────────────────────────── */
    #main-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 상단 Topbar ───────────────────────────────────────────────────────── */
    #topbar {
      height: var(--topbar-height);
      background: var(--surface);
      border-bottom: 1px solid var(--border-solid);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .topbar-divider {
      width: 1px;
      height: 18px;
      background: var(--border-solid);
    }

    .topbar-spacer {
      flex: 1;
    }

    /* 로그인 상태 뱃지 */
    .login-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .login-badge.logged-out {
      background: #fff0f0;
      color: #c92a2a;
    }

    .login-badge.logged-in {
      background: var(--primary-dim);
      color: var(--nav-active-txt);
    }

    .login-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .login-badge.logged-out .login-dot  { background: #e03131; }
    .login-badge.logged-in  .login-dot  { background: var(--primary); }

    /* 버튼 공통 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .15s, border-color .15s, opacity .15s, transform .08s;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }

    .btn-secondary {
      background: var(--surface-hover);
      color: var(--text-primary);
      border-color: var(--border-solid);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--border-solid); }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-danger:hover:not(:disabled) { background: #c92a2a; }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border-solid);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text-primary); }

    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-lg { padding: 11px 22px; font-size: 14.5px; }

    /* ── 콘텐츠 영역 ───────────────────────────────────────────────────────── */
    #content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* 패널 공통 */
    .panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 24px;
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* ── 카드 ──────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border-solid);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-solid);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
    }

    .card-body {
      padding: 20px;
    }

    /* ── 폼 요소 ───────────────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    input[type="url"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg);
      border: 1px solid var(--border-solid);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      appearance: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(3,199,90,.12);
      background: var(--surface);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-disabled);
    }

    textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    .form-row {
      display: grid;
      gap: 12px;
    }
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
    .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

    /* ── 인라인 입력 + 버튼 ────────────────────────────────────────────────── */
    .input-action {
      display: flex;
      gap: 8px;
    }

    .input-action input {
      flex: 1;
    }

    /* ── URL 리스트 ────────────────────────────────────────────────────────── */
    .url-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .url-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border-solid);
      border-radius: var(--radius-sm);
      transition: background .12s;
    }

    .url-item:hover { background: var(--surface-hover); }

    .url-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-disabled);
      width: 20px;
      flex-shrink: 0;
      text-align: center;
    }

    .url-text {
      flex: 1;
      font-size: 13px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 상태 점 */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.idle     { background: #adb5bd; }
    .status-dot.running  { background: #f0a500; animation: pulse-dot .8s infinite; }
    .status-dot.done     { background: var(--primary); }
    .status-dot.error    { background: var(--danger); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── 진행률 바 ─────────────────────────────────────────────────────────── */
    .progress-wrap {
      background: var(--border-solid);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width .4s ease;
      width: 0%;
    }

    /* ── 단계 리스트 ───────────────────────────────────────────────────────── */
    .step-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 0;
      position: relative;
    }

    .step-item:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 11px;
      top: 36px;
      bottom: 0;
      width: 2px;
      background: var(--border-solid);
    }

    .step-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border-solid);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-disabled);
      position: relative;
      z-index: 1;
      transition: all .2s;
    }

    .step-item.done   .step-circle { border-color: var(--primary); background: var(--primary); color: #fff; }
    .step-item.active .step-circle { border-color: var(--primary); background: var(--surface);  color: var(--primary); }
    .step-item.error  .step-circle { border-color: var(--danger);  background: var(--danger);   color: #fff; }

    .step-info {}
    .step-name  { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .step-desc  { font-size: 12px;   color: var(--text-secondary); margin-top: 2px; }

    /* ── 로그 창 ───────────────────────────────────────────────────────────── */
    .log-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-solid);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .12s;
      font-family: inherit;
    }

    .filter-btn:hover  { background: var(--surface-hover); }
    .filter-btn.active { background: var(--text-primary); color: var(--surface); border-color: var(--text-primary); }
    .filter-btn.info   { }
    .filter-btn.warning.active { background: var(--warning); border-color: var(--warning); color: #fff; }
    .filter-btn.error.active   { background: var(--danger);  border-color: var(--danger);  color: #fff; }

    .log-toolbar-spacer { flex: 1; }

    .log-output {
      background: var(--log-bg);
      color: var(--log-text);
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12.5px;
      line-height: 1.75;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-solid);
      padding: 14px 16px;
      overflow-y: auto;
      min-height: 300px;
      max-height: calc(100vh - 280px);
    }

    .log-line { display: flex; gap: 10px; }
    .log-time  { color: var(--text-disabled); flex-shrink: 0; }
    .log-level { flex-shrink: 0; width: 56px; font-weight: 700; }
    .log-msg   { flex: 1; word-break: break-all; }

    .log-level.INFO    { color: #4dabf7; }
    .log-level.WARNING { color: var(--warning); }
    .log-level.ERROR   { color: var(--danger);  }
    .log-level.DEBUG   { color: var(--text-disabled); }

    .log-line.is-error   .log-msg { color: var(--danger); }
    .log-line.is-warning .log-msg { color: var(--warning); }
    .log-line.is-ok      .log-msg { color: var(--primary); }

    /* ── 설정 탭 구분선 ────────────────────────────────────────────────────── */
    .settings-section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      color: var(--text-disabled);
      text-transform: uppercase;
      margin-bottom: 12px;
      margin-top: 4px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border-solid);
      margin: 20px 0;
    }

    /* ── 스피너 ────────────────────────────────────────────────────────────── */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }

    .spinner.dark {
      border-color: rgba(0,0,0,.15);
      border-top-color: var(--text-primary);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── 알림 토스트 ───────────────────────────────────────────────────────── */
    #toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      padding: 11px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      max-width: 320px;
      pointer-events: auto;
      animation: toast-in .22s ease;
    }

    .toast.ok      { background: var(--primary); color: #fff; }
    .toast.error   { background: var(--danger);  color: #fff; }
    .toast.warning { background: #f08c00;         color: #fff; }
    .toast.info    { background: var(--surface);  color: var(--text-primary);
                     border: 1px solid var(--border-solid); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── 빈 상태 ───────────────────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      color: var(--text-disabled);
      text-align: center;
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: .5;
    }

    .empty-text { font-size: 13px; }

    /* ── 유틸 ──────────────────────────────────────────────────────────────── */
    .flex      { display: flex; }
    .items-center { align-items: center; }
    .gap-8     { gap: 8px; }
    .gap-12    { gap: 12px; }
    .ml-auto   { margin-left: auto; }
    .mt-12     { margin-top: 12px; }
    .mt-16     { margin-top: 16px; }
    .mt-20     { margin-top: 20px; }
    .mb-12     { margin-bottom: 12px; }
    .mb-16     { margin-bottom: 16px; }

    .grid-cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .text-sm      { font-size: 12.5px; }
    .text-muted   { color: var(--text-secondary); }
    .text-primary { color: var(--primary); font-weight: 600; }
    .font-mono    { font-family: 'Consolas', monospace; }

    /* ── 스크롤바 ──────────────────────────────────────────────────────────── */
    ::-webkit-scrollbar         { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track   { background: transparent; }
    ::-webkit-scrollbar-thumb   { background: var(--border-solid); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-disabled); }
  </style>
</head>
<body>

<div id="app">

  <!-- ── 사이드바 ─────────────────────────────────────────────────────────── -->
  <aside id="sidebar">

    <div class="sidebar-brand">
      <div class="brand-icon">N</div>
      <div class="brand-name">
        블로그 자동화
        <span>SmartStore Autoposter</span>
      </div>
    </div>

    <nav class="nav-section">
      <div class="nav-label" style="margin-top:4px;">메뉴</div>

      <button class="nav-item active" data-panel="urls">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        URL 목록
        <span class="nav-badge" id="nav-badge-urls">0</span>
      </button>

      <button class="nav-item" data-panel="run">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        포스팅 실행
      </button>

      <button class="nav-item" data-panel="log">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
