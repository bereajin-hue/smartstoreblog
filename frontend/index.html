<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네이버 블로그 자동 포스터</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #03c75a;
      --primary-dark: #029a47;
      --danger: #e74c3c;
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #dde2ea;
      --text: #1a1a2e;
      --muted: #6b7280;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    header .logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
    }

    header h1 { font-size: 18px; font-weight: 700; }

    .badge {
      margin-left: auto;
      background: #e8f5ee;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px;
      display: grid;
      gap: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .step {
      width: 24px;
      height: 24px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type=text], input[type=password], input[type=url], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color .2s;
      outline: none;
      background: #fafbfc;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      background: #fff;
    }

    textarea { resize: vertical; min-height: 160px; }

    .row { display: grid; gap: 14px; }
    .row.cols-2 { grid-template-columns: 1fr 1fr; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .2s, transform .1s;
    }

    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #f0f4f8; color: var(--text); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f0f4f8; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

    .status-bar {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }

    .status-bar.info  { background: #e8f4fd; color: #1565c0; display: block; }
    .status-bar.ok    { background: #e8f5ee; color: #1b5e20; display: block; }
    .status-bar.error { background: #fdecea; color: #b71c1c; display: block; }
    .status-bar.loading { background: #fff8e1; color: #e65100; display: block; }

    .product-preview {
      display: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 16px;
    }

    .product-preview.visible { display: block; }

    .preview-header {
      background: #f8fafb;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }

    .preview-body { padding: 16px; }
    .preview-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .preview-price { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    .preview-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }

    .image-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .image-grid img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .pipeline {
      display: flex;
      gap: 0;
      align-items: center;
      margin-bottom: 20px;
    }

    .pipeline-step {
      flex: 1;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: 6px;
      background: #f0f4f8;
      color: var(--muted);
      position: relative;
    }

    .pipeline-step.active { background: var(--primary); color: #fff; }
    .pipeline-step.done { background: #e8f5ee; color: var(--primary-dark); }

    .pipeline-step:not(:last-child)::after {
      content: '→';
      position: absolute;
      right: -12px;
      color: var(--border);
      font-size: 14px;
    }

    .pipeline-sep { width: 24px; flex-shrink: 0; }

    .log-box {
      background: #1a1a2e;
      color: #a8d8a8;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 8px;
      padding: 12px 16px;
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.7;
      display: none;
    }

    .log-box.visible { display: block; }
    .log-entry { margin: 0; }
    .log-entry.err { color: #ff8a80; }
    .log-entry.ok  { color: #69f0ae; }

    .tone-select { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

    .tone-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #f0f4f8;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }

    .tone-btn.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .row.cols-2 { grid-template-columns: 1fr; }
      .pipeline-step:not(:last-child)::after { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">N</div>
  <h1>네이버 블로그 자동 포스터</h1>
  <span class="badge">스마트스토어 연동</span>
</header>

<main>

  <!-- STEP 1: 자격증명 -->
  <div class="card">
    <div class="card-title">
      <span class="step">1</span> 네이버 계정 설정
    </div>
    <div class="row cols-2">
      <div>
        <label>네이버 아이디</label>
        <input type="text" id="naverId" placeholder="naver_id" />
      </div>
      <div>
        <label>네이버 비밀번호</label>
        <input type="password" id="naverPw" placeholder="••••••••" />
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveCredentials()">저장</button>
      <button class="btn btn-outline" onclick="loadCredentials()">불러오기</button>
      <button class="btn btn-danger" onclick="deleteCredentials()">삭제</button>
    </div>
    <div id="credStatus" class="status-bar" style="margin-top:12px;"></div>
  </div>

  <!-- STEP 2: 상품 파싱 -->
  <div class="card">
    <div class="card-title">
      <span class="step">2</span> 스마트스토어 상품 파싱
    </div>
    <label>상품 URL</label>
    <input type="url" id="productUrl" placeholder="https://smartstore.naver.com/..." />
    <div class="btn-group">
      <button class="btn btn-primary" onclick="scrapeProduct()">상품 정보 가져오기</button>
    </div>
    <div id="scrapeStatus" class="status-bar" style="margin-top:12px;"></div>
    <div id="productPreview" class="product-preview">
      <div class="preview-header">파싱된 상품 정보</div>
      <div class="preview-body">
        <div class="preview-title" id="previewTitle"></div>
        <div class="preview-price" id="previewPrice"></div>
        <div class="preview-desc" id="previewDesc"></div>
        <div class="image-grid" id="previewImages"></div>
      </div>
    </div>
  </div>

  <!-- STEP 3: 포스팅 생성 -->
  <div class="card">
    <div class="card-title">
      <span class="step">3</span> 블로그 포스팅 생성 (Gemini AI)
    </div>
    <div class="row" style="margin-bottom:14px;">
      <div>
        <label>말투 선택</label>
        <div class="tone-select">
          <button class="tone-btn selected" data-tone="friendly" onclick="selectTone(this)">친근하게</button>
          <button class="tone-btn" data-tone="formal" onclick="selectTone(this)">공식적으로</button>
          <button class="tone-btn" data-tone="excited" onclick="selectTone(this)">열정적으로</button>
        </div>
      </div>
    </div>
    <div>
      <label>추가 키워드 (쉼표 구분)</label>
      <input type="text" id="keywords" placeholder="예: 가성비, 추천, 선물" />
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="generatePost()">포스팅 생성</button>
    </div>
    <div id="generateStatus" class="status-bar" style="margin-top:12px;"></div>

    <div id="postEditor" style="display:none; margin-top:16px;">
      <div style="margin-bottom:14px;">
        <label>포스팅 제목</label>
        <input type="text" id="postTitle" />
      </div>
      <div>
        <label>포스팅 본문</label>
        <textarea id="postBody" style="min-height:260px;"></textarea>
      </div>
    </div>
  </div>

  <!-- STEP 4: 게시 -->
  <div class="card">
    <div class="card-title">
      <span class="step">4</span> 블로그에 게시
    </div>
    <div class="pipeline">
      <div class="pipeline-step" id="pipe1">상품 파싱</div>
      <div class="pipeline-sep"></div>
      <div class="pipeline-step" id="pipe2">AI 생성</div>
      <div class="pipeline-sep"></div>
      <div class="pipeline-step" id="pipe3">블로그 게시</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="postBlog()">블로그에 게시하기</button>
      <button class="btn btn-secondary" onclick="automate()">전체 자동 실행</button>
    </div>
    <div id="postStatus" class="status-bar" style="margin-top:12px;"></div>
    <div id="logBox" class="log-box" style="margin-top:12px;"></div>
  </div>

</main>

<footer>
  Naver Blog Autoposter &mdash; Flask + Selenium + Gemini AI
</footer>

<script>
  const API = '';
  let selectedTone = 'friendly';
  let scrapedProduct = null;

  // ── 상태 표시 ────────────────────────────────────────────────────────────
  function setStatus(id, type, msg) {
    const el = document.getElementById(id);
    el.className = `status-bar ${type}`;
    el.textContent = msg;
  }

  function appendLog(msg, type = '') {
    const box = document.getElementById('logBox');
    box.classList.add('visible');
    const p = document.createElement('p');
    p.className = `log-entry ${type}`;
    const time = new Date().toLocaleTimeString('ko-KR');
    p.textContent = `[${time}] ${msg}`;
    box.appendChild(p);
    box.scrollTop = box.scrollHeight;
  }

  function setPipe(step) {
    ['pipe1','pipe2','pipe3'].forEach((id, i) => {
      const el = document.getElementById(id);
      el.className = 'pipeline-step' + (i + 1 < step ? ' done' : i + 1 === step ? ' active' : '');
    });
  }

  // ── 말투 선택 ─────────────────────────────────────────────────────────────
  function selectTone(btn) {
    document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedTone = btn.dataset.tone;
  }

  // ── 자격증명 ──────────────────────────────────────────────────────────────
  async function saveCredentials() {
    const id = document.getElementById('naverId').value.trim();
    const pw = document.getElementById('naverPw').value;
    if (!id || !pw) { setStatus('credStatus', 'error', '아이디와 비밀번호를 입력하세요.'); return; }

    setStatus('credStatus', 'loading', '저장 중...');
    const res = await fetch(`${API}/api/credentials`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ naver_id: id, naver_pw: pw }),
    });
    const json = await res.json();
    setStatus('credStatus', json.ok ? 'ok' : 'error', json.message || json.error);
  }

  async function loadCredentials() {
    const res = await fetch(`${API}/api/credentials`);
    const json = await res.json();
    if (json.ok && json.data.naver_id) {
      document.getElementById('naverId').value = json.data.naver_id;
      setStatus('credStatus', 'ok', '저장된 자격증명을 불러왔습니다.');
    } else {
      setStatus('credStatus', 'info', '저장된 자격증명이 없습니다.');
    }
  }

  async function deleteCredentials() {
    if (!confirm('저장된 자격증명을 삭제할까요?')) return;
    const res = await fetch(`${API}/api/credentials`, { method: 'DELETE' });
    const json = await res.json();
    setStatus('credStatus', json.ok ? 'ok' : 'error', json.message || json.error);
    document.getElementById('naverId').value = '';
    document.getElementById('naverPw').value = '';
  }

  // ── 상품 파싱 ─────────────────────────────────────────────────────────────
  async function scrapeProduct() {
    const url = document.getElementById('productUrl').value.trim();
    if (!url) { setStatus('scrapeStatus', 'error', '상품 URL을 입력하세요.'); return; }

    setStatus('scrapeStatus', 'loading', '상품 정보를 가져오는 중...');
    setPipe(1);

    try {
      const res = await fetch(`${API}/api/scrape`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const json = await res.json();
      if (!json.ok) { setStatus('scrapeStatus', 'error', json.error); return; }

      scrapedProduct = json.data;
      renderProductPreview(json.data);
      setStatus('scrapeStatus', 'ok', `상품 파싱 완료 - ${json.data.title}`);
      setPipe(2);
    } catch (e) {
      setStatus('scrapeStatus', 'error', `오류: ${e.message}`);
    }
  }

  function renderProductPreview(product) {
    document.getElementById('previewTitle').textContent = product.title || '(제목 없음)';
    document.getElementById('previewPrice').textContent = product.price || '';
    document.getElementById('previewDesc').textContent = product.description || '';

    const grid = document.getElementById('previewImages');
    grid.innerHTML = '';
    (product.images || []).slice(0, 5).forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.onerror = () => img.remove();
      grid.appendChild(img);
    });

    document.getElementById('productPreview').classList.add('visible');
  }

  // ── 포스팅 생성 ───────────────────────────────────────────────────────────
  async function generatePost() {
    if (!scrapedProduct) { setStatus('generateStatus', 'error', '먼저 상품 정보를 가져오세요.'); return; }

    const keywords = document.getElementById('keywords').value
      .split(',').map(k => k.trim()).filter(Boolean);

    setStatus('generateStatus', 'loading', 'AI가 포스팅을 작성 중입니다...');

    try {
      const res = await fetch(`${API}/api/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product: scrapedProduct, tone: selectedTone, keywords }),
      });
      const json = await res.json();
      if (!json.ok) { setStatus('generateStatus', 'error', json.error); return; }

      document.getElementById('postTitle').value = json.data.title;
      document.getElementById('postBody').value = json.data.body;
      document.getElementById('postEditor').style.display = 'block';
      setStatus('generateStatus', 'ok', '포스팅 생성 완료! 내용을 검토하고 수정할 수 있습니다.');
      setPipe(3);
    } catch (e) {
      setStatus('generateStatus', 'error', `오류: ${e.message}`);
    }
  }

  // ── 블로그 게시 ───────────────────────────────────────────────────────────
  async function postBlog() {
    const title = document.getElementById('postTitle').value.trim();
    const body = document.getElementById('postBody').value.trim();
    if (!title || !body) { setStatus('postStatus', 'error', '포스팅 제목과 본문을 먼저 생성하세요.'); return; }

    setStatus('postStatus', 'loading', '블로그에 게시 중... (브라우저가 자동으로 열립니다)');
    appendLog('블로그 게시 시작');

    try {
      const res = await fetch(`${API}/api/post`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          body,
          images: scrapedProduct?.images || [],
        }),
      });
      const json = await res.json();
      if (json.ok) {
        setStatus('postStatus', 'ok', `게시 완료! ${json.post_url}`);
        appendLog(`게시 완료: ${json.post_url}`, 'ok');
      } else {
        setStatus('postStatus', 'error', json.error);
        appendLog(`오류: ${json.error}`, 'err');
      }
    } catch (e) {
      setStatus('postStatus', 'error', `오류: ${e.message}`);
      appendLog(`오류: ${e.message}`, 'err');
    }
  }

  // ── 전체 자동화 ───────────────────────────────────────────────────────────
  async function automate() {
    const url = document.getElementById('productUrl').value.trim();
    if (!url) { setStatus('postStatus', 'error', '상품 URL을 먼저 입력하세요.'); return; }

    const keywords = document.getElementById('keywords').value
      .split(',').map(k => k.trim()).filter(Boolean);

    setStatus('postStatus', 'loading', '전체 자동화 실행 중...');
    appendLog('전체 자동화 파이프라인 시작');
    setPipe(1);

    try {
      const res = await fetch(`${API}/api/automate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, tone: selectedTone, keywords }),
      });
      const json = await res.json();

      if (json.product) {
        scrapedProduct = json.product;
        renderProductPreview(json.product);
        appendLog(`상품 파싱 완료: ${json.product.title}`, 'ok');
        setPipe(2);
      }

      if (json.post) {
        document.getElementById('postTitle').value = json.post.title;
        document.getElementById('postBody').value = json.post.body;
        document.getElementById('postEditor').style.display = 'block';
        appendLog('포스팅 생성 완료', 'ok');
        setPipe(3);
      }

      if (json.ok) {
        setStatus('postStatus', 'ok', `완료! ${json.post_url}`);
        appendLog(`블로그 게시 완료: ${json.post_url}`, 'ok');
      } else {
        setStatus('postStatus', 'error', json.error);
        appendLog(`오류: ${json.error}`, 'err');
      }
    } catch (e) {
      setStatus('postStatus', 'error', `오류: ${e.message}`);
      appendLog(`오류: ${e.message}`, 'err');
    }
  }

  // 페이지 로드 시 저장된 자격증명 확인
  loadCredentials().catch(() => {});
</script>

</body>
</html>
